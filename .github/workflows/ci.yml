name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Run Black (Code Formatting Check)
      run: uv run black --check --diff app/ domains/ tests/ scripts/

    - name: Run Ruff (Linting)
      run: uv run ruff check app/ domains/ tests/ scripts/

    - name: Run mypy (Type Checking)
      run: uv run mypy app/ domains/ scripts/
      continue-on-error: true  # Allow failures initially during migration

    - name: Check import sorting (isort)
      run: uv run isort --check-only --diff app/ domains/ tests/ scripts/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      neo4j:
        image: neo4j:5.14-community@sha256:677d3ad677cbf3993db10b60cf990b0df394687210df3f1ce124459ae8542e64
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

    - name: Install Python dependencies
      run: uv sync --all-extras

    - name: Wait for Neo4j
      run: |
        for i in {1..30}; do
          if curl -f http://localhost:7474/ > /dev/null 2>&1; then
            echo "Neo4j is ready!"
            break
          fi
          echo "Waiting for Neo4j... ($i/30)"
          sleep 2
        done

    - name: Run unit tests
      run: uv run pytest tests/unit -v --cov=app --cov=domains --cov-report=xml --cov-report=term
      env:
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: testpassword

    - name: Run service tests
      run: uv run pytest tests/service -v --cov=app --cov=domains --cov-append --cov-report=xml --cov-report=term
      env:
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: testpassword

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-watchman
        fail_ci_if_error: false
      continue-on-error: true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        push: false
        tags: the-watchman:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker Compose configuration
      run: |
        docker compose config

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit (Security Linting)
      run: |
        bandit -r app/ domains/ scripts/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Run Safety (Dependency Vulnerability Check)
      run: |
        safety check --json
      continue-on-error: true

    - name: Upload Bandit report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json
